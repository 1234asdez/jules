# Shadow Map Configuration
shadowMapResolution=2048
shadowDistance=120.0
shadowDistanceRenderMul=1.0
shadowMapFov=90.0

# G-Buffers Format Configuration
# colortex0: Base Color (RGB), Alpha (A)
const.colortex0.format=RGBA8

# colortex1: Normals (RGB), Material ID / Data (A)
const.colortex1.format=RGBA16F

# colortex2: Lightmap (RG), Emission (B), Depth (A)
const.colortex2.format=RGBA16F

# Optional configurations for modern Iris
const.colortex3.format=RGBA16F
